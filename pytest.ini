[pytest]
# Default options: verbose output, show short test summary, use chromium browser
addopts = -v --tb=short --browser=chromium
# Where to look for tests
testpaths = tests
# Markers used in the suite
markers =
    smoke: Fast smoke tests (title, hero, nav)
    ui: Visual / layout tests
    functional: Interactive / behavioral tests
    responsive: Mobile & viewport tests
    accessibility: Accessibility checks
